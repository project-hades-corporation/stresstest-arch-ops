services:
  backend:
    image: python:3.12-slim
    container_name: arch-stress-backend
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    environment:
      USE_KEYLESS_CLI: "true"
      DEFAULT_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma4:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "pip install -r backend/requirements.txt && python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: node:20-alpine
    container_name: arch-stress-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
